<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>Prompt & Skill Hub</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#">JAY ARCHIVE</a>
    <span class="count" id="headerCount">Loading</span>
  </header>

  <main>
    <section class="intro">
      <p class="eyebrow">PERSONAL AI LIBRARY</p>
      <h1>Prompt &<br>Skill Hub</h1>
      <p class="lede">찾고, 열고, 바로 사용합니다.</p>
    </section>

    <nav class="tabs" aria-label="콘텐츠 탭">
      <button class="tab is-active" data-tab="prompts">Prompt Gallery</button>
      <button class="tab" data-tab="skills">Skill Hub</button>
    </nav>

    <section class="toolbar">
      <label class="search-wrap">
        <span class="sr-only">검색</span>
        <input id="search" type="search" placeholder="Search" autocomplete="off">
      </label>
      <span class="result-count" id="resultCount"></span>
    </section>

    <section id="content" aria-live="polite"></section>
  </main>

  <dialog id="detailDialog">
    <button class="dialog-close" id="dialogClose" aria-label="닫기">×</button>
    <div id="dialogBody"></div>
  </dialog>

  <div class="toast" id="toast" role="status">Copied</div>
  <script src="app.js"></script>
</body>
</html>
